<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgPid" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="gridPid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#14b8a6" stroke-width="0.5" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgPid)"/>
  <rect width="800" height="450" fill="url(#gridPid)"/>

  <!-- Main Telemetry Frame -->
  <rect x="44" y="36" width="712" height="378" rx="14" fill="#0b1120" fill-opacity="0.92" stroke="#0d9488" stroke-width="1.5"/>
  <rect x="44" y="36" width="712" height="38" rx="14" fill="#134e4a" fill-opacity="0.45"/>
  <circle cx="68" cy="55" r="5.5" fill="#10b981"/>
  <text x="86" y="59" fill="#5eead4" font-family="monospace" font-size="12" font-weight="700">SYS.CONTROL // PID CLOSED-LOOP TELEMETRY SIMULATOR</text>
  <text x="615" y="59" fill="#99f6e4" font-family="monospace" font-size="11">DT: 10ms · 100Hz</text>

  <!-- Oscilloscope Plot Area -->
  <rect x="64" y="92" width="460" height="296" rx="10" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Grid Lines inside Oscilloscope -->
  <line x1="64" y1="166" x2="524" y2="166" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="76" y="158" fill="#38bdf8" font-family="monospace" font-size="10">SETPOINT (r = 100 RPM)</text>

  <line x1="64" y1="240" x2="524" y2="240" stroke="#1e293b" stroke-width="1"/>
  <line x1="64" y1="314" x2="524" y2="314" stroke="#1e293b" stroke-width="1"/>

  <!-- Step Response Curve (PV) -->
  <path d="M 74 356 C 115 356, 130 112, 175 128 C 215 142, 235 182, 275 162 C 315 154, 345 167, 510 166" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Control Effort Curve (PWM) -->
  <path d="M 74 356 L 95 110 L 145 210 L 210 175 L 300 185 L 510 184" fill="none" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="0.7" stroke-dasharray="3 3"/>

  <!-- Legend inside Oscilloscope -->
  <rect x="330" y="344" width="178" height="30" rx="6" fill="#0f172a" stroke="#334155"/>
  <circle cx="346" cy="359" r="4" fill="#10b981"/>
  <text x="356" y="363" fill="#e2e8f0" font-family="monospace" font-size="10">PV(t)</text>
  <circle cx="404" cy="359" r="4" fill="#38bdf8"/>
  <text x="414" y="363" fill="#e2e8f0" font-family="monospace" font-size="10">SP</text>
  <circle cx="448" cy="359" r="4" fill="#f59e0b"/>
  <text x="458" y="363" fill="#e2e8f0" font-family="monospace" font-size="10">PWM%</text>

  <!-- Right Control Panel: Gains & Metrics -->
  <rect x="542" y="92" width="194" height="296" rx="10" fill="#111827" stroke="#334155"/>
  <text x="558" y="116" fill="#5eead4" font-family="monospace" font-size="11" font-weight="700">GAIN PARAMETERS</text>

  <!-- Kp -->
  <text x="558" y="142" fill="#cbd5e1" font-family="monospace" font-size="11">Kp = 2.40</text>
  <rect x="558" y="150" width="162" height="6" rx="3" fill="#1e293b"/>
  <rect x="558" y="150" width="110" height="6" rx="3" fill="#14b8a6"/>
  <circle cx="668" cy="153" r="6" fill="#5eead4"/>

  <!-- Ki -->
  <text x="558" y="182" fill="#cbd5e1" font-family="monospace" font-size="11">Ki = 0.85</text>
  <rect x="558" y="190" width="162" height="6" rx="3" fill="#1e293b"/>
  <rect x="558" y="190" width="76" height="6" rx="3" fill="#38bdf8"/>
  <circle cx="634" cy="193" r="6" fill="#7dd3fc"/>

  <!-- Kd -->
  <text x="558" y="222" fill="#cbd5e1" font-family="monospace" font-size="11">Kd = 0.35</text>
  <rect x="558" y="230" width="162" height="6" rx="3" fill="#1e293b"/>
  <rect x="558" y="230" width="54" height="6" rx="3" fill="#818cf8"/>
  <circle cx="612" cy="233" r="6" fill="#a5b4fc"/>

  <!-- Telemetry KPI Boxes -->
  <rect x="558" y="256" width="162" height="52" rx="8" fill="#0f291e" stroke="#10b981"/>
  <text x="570" y="275" fill="#6ee7b7" font-family="monospace" font-size="10">OVERSHOOT / SETTLING</text>
  <text x="570" y="296" fill="#ffffff" font-family="monospace" font-size="13" font-weight="700">Mp: 8.4% · Ts: 0.42s</text>

  <rect x="558" y="318" width="162" height="52" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="570" y="337" fill="#94a3b8" font-family="monospace" font-size="10">STEADY-STATE ERROR</text>
  <text x="570" y="358" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">ess: 0.00% (LOCKED)</text>
</svg>
