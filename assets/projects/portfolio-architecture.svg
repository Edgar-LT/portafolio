<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bgArch" x1="0" y1="0" x2="800" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="gridArch" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgArch)"/>
  <rect width="800" height="450" fill="url(#gridArch)"/>

  <rect x="44" y="36" width="712" height="378" rx="14" fill="#0b1120" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="44" y="36" width="712" height="38" rx="14" fill="#1e293b"/>
  <circle cx="68" cy="55" r="5.5" fill="#3b82f6"/>
  <circle cx="86" cy="55" r="5.5" fill="#6366f1"/>
  <circle cx="104" cy="55" r="5.5" fill="#14b8a6"/>
  <text x="130" y="59" fill="#93c5fd" font-family="monospace" font-size="12" font-weight="700">PORTFOLIO ENGINE // DATA-DRIVEN ARCHITECTURE (ES/EN + CV PDF)</text>

  <!-- Central Node: data.js -->
  <rect x="285" y="102" width="230" height="76" rx="12" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
  <text x="335" y="132" fill="#ffffff" font-family="monospace" font-size="14" font-weight="700">js/data.js (SSOT)</text>
  <text x="310" y="156" fill="#bfdbfe" font-family="monospace" font-size="11">Bilingual ES/EN · Schema JSON</text>

  <!-- Connectors -->
  <path d="M 330 178 L 175 245" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 400 178 L 400 245" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 470 178 L 625 245" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Module 1: Web UI & Theme -->
  <rect x="74" y="245" width="202" height="128" rx="12" fill="#111827" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="94" y="275" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="700">INDEX.HTML // SPA UI</text>
  <text x="94" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Filtros Dinámicos &amp; Modal</text>
  <text x="94" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Tema Claro / Azul Noche</text>
  <text x="94" y="344" fill="#cbd5e1" font-family="sans-serif" font-size="12">• WCAG 2.1 AA + JSON-LD</text>

  <!-- Module 2: Printable CV -->
  <rect x="299" y="245" width="202" height="128" rx="12" fill="#111827" stroke="#6366f1" stroke-width="1.5"/>
  <text x="319" y="275" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="700">CV.HTML // PDF ENGINE</text>
  <text x="319" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Hoja A4/Carta Optimizada</text>
  <text x="319" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Exportación PDF 1-Click</text>
  <text x="319" y="344" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Sincronizado en ES / EN</text>

  <!-- Module 3: GitHub Live & QA -->
  <rect x="524" y="245" width="202" height="128" rx="12" fill="#111827" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="544" y="275" fill="#5eead4" font-family="monospace" font-size="12" font-weight="700">GITHUB API &amp; VERIFY</text>
  <text x="544" y="300" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Telemetría REST GitHub</text>
  <text x="544" y="322" fill="#cbd5e1" font-family="sans-serif" font-size="12">• Auditoría PowerShell CI</text>
  <text x="544" y="344" fill="#cbd5e1" font-family="sans-serif" font-size="12">• GitHub Pages CD Activo</text>
</svg>
